<!--
  404 ERROR PAGE
  ==============
  Deploy as your custom 404 page.
  - Vercel: Create pages/404.tsx or app/not-found.tsx
  - Netlify: Create 404.html in public/
  - Nginx: error_page 404 /404.html;
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Tengri Kezgen Köçer</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 600px; }
    .error-code {
      font-size: 120px;
      font-weight: 800;
      background: linear-gradient(135deg, #7c83ff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 { font-size: 28px; font-weight: 600; margin-bottom: 12px; }
    p { color: #a0aec0; font-size: 16px; line-height: 1.6; margin-bottom: 32px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .primary {
      background: #7c83ff;
      color: white;
    }
    .primary:hover { background: #6366f1; transform: translateY(-1px); }
    .secondary {
      background: rgba(255,255,255,0.08);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .secondary:hover { background: rgba(255,255,255,0.12); }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>
      The page you're looking for doesn't exist or has been moved.
      Let us help you find what you need.
    </p>
    <div class="actions">
      <a href="/" class="primary">
        ← Back to Home
      </a>
      <a href="/find-country" class="secondary">
        Find a Country
      </a>
      <a href="/contact" class="secondary">
        Contact Us
      </a>
    </div>
  </div>
</body>
</html>
